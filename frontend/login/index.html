<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../login/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Welcome</h2>

        <input id="nickname" placeholder="Nickname" />
        <input id="password" type="password" placeholder="Password" />

        <button onclick="login()">Sign In</button>

        <p id="result"></p>

        <span class="link" onclick="goRegister()">No account? Register</span>
    </div>
</div>

<script src="/login/script.js"></script>
</body>
</html>
